@if (questao(); as q) {
  <article class="ucam-stack ucam-stack--lg" appProvaProtegida>
    <header class="ucam-cluster ucam-cluster--entre">
      <span class="ucam-cluster">
        <ucam-icon-tile [icon]="iconeCaderno()" />
        <h2 class="ucam-section__title">{{ rotuloCaderno() }} · Questão {{ n() }} de {{ totalNoCaderno() }}</h2>
      </span>
      <ucam-badge
        [tone]="escolhida() ? 'success' : 'neutral'"
        variant="dot"
        [label]="escolhida() ? 'Respondida' : 'Em branco'"
      />
    </header>

    @if (q.textoreferencia) {
      <section class="ucam-stack">
        <ucam-section-bar title="Texto de apoio" [level]="3" />
        <ucam-citacao><div class="ucam-stack ucam-stack--sm" data-texto-referencia [innerHTML]="q.textoreferencia"></div></ucam-citacao>
      </section>
    }
    <div data-enunciado [innerHTML]="q.descricao"></div>

    <fieldset class="ucam-stack ucam-stack--sm">
      <legend class="ucam-sr-only">Alternativas da questão {{ n() }}</legend>
      @for (a of alternativas(); track a.oid) {
        <label class="ucam-choice-card">
          <input type="radio" [name]="'questao-' + q.oid" [value]="a.oid" [checked]="escolhida() === a.oid" (change)="escolher(a.oid)" />
          <span class="ucam-choice-card__figura" aria-hidden="true">{{ a.letra }}</span>
          <span class="ucam-choice-card__titulo">
            <span class="ucam-sr-only">Alternativa {{ a.letra }}: </span>
            <span [innerHTML]="a.descricao"></span>
          </span>
        </label>
      }
    </fieldset>

    <footer class="ucam-cluster ucam-cluster--entre">
      <span [ucamTooltip]="'Esta é a primeira questão'" [tooltipDisabled]="!ehPrimeira()">
        <ucam-button variant="secondary" size="lg" iconStart="chevronLeft" [disabled]="ehPrimeira()" (click)="anterior()">Anterior</ucam-button>
      </span>
      @if (ehPrimeira()) {
        <span class="ucam-sr-only">Esta é a primeira questão.</span>
      }
      <ucam-button variant="primary" size="lg" [iconEnd]="proximaEhFim() ? 'send' : 'chevronRight'" (click)="proxima()">{{ rotuloProxima() }}</ucam-button>
    </footer>
  </article>
}
