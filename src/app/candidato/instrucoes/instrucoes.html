<app-moldura>
  <ucam-page-header variante="barra" title="Antes de começar" [breadcrumb]="trilha()" />

  <div class="ucam-corpo ucam-stack ucam-stack--lg">
    <ucam-stepper label="Etapas do vestibular online" [current]="1" [steps]="etapas" />

    <section class="ucam-stack" aria-labelledby="t-sua-prova">
      <h2 class="ucam-section__title" id="t-sua-prova">Sua prova</h2>
      <div class="ucam-stats">
        <ucam-stat label="Tempo de prova" [value]="tempoTexto()" meta="Começa a contar ao iniciar" icon="clock" [state]="carregando() ? 'loading' : 'idle'" />
        <ucam-stat label="Questões objetivas" [value]="totalQuestoes()" [meta]="cadernosTexto()" icon="listChecks" [state]="carregando() ? 'loading' : 'idle'" />
        <ucam-stat label="Redação" [value]="temRedacao() ? 'Sim' : 'Não'" [meta]="temRedacao() ? 'Mínimo de ' + redacaoMin + ' caracteres' : 'Esta prova não tem redação'" icon="pencil" [state]="carregando() ? 'loading' : 'idle'" />
      </div>
    </section>

    <section class="ucam-stack" aria-labelledby="t-como-funciona">
      <h2 class="ucam-section__title" id="t-como-funciona">Como a prova funciona</h2>
      <app-instrucoes-lista [cartoes]="true" />
    </section>

    <ucam-card as="section" titulo="Pronto para começar?" apoio="Confirme que leu as orientações. O relógio começa no clique e não para." icone="clipboardCheck">
      <div class="ucam-stack">
        <ucam-checkbox
          label="Li as orientações e estou pronto para começar"
          [(checked)]="confirmado"
          [invalid]="faltaConfirmar()"
          [errorMessage]="faltaConfirmar() ? 'Marque a confirmação para começar a prova.' : null"
        />

        @if (erro()) {
          <ucam-alert tone="danger" live="assertive">{{ erro() }}</ucam-alert>
        }

        <div class="ucam-cluster ucam-cluster--entre">
          <span class="ucam-field__hint">Ao clicar, o tempo de {{ tempoTexto() }} começa a contar e não para.</span>
          <ucam-button variant="primary" size="lg" iconStart="doorOpen" [loading]="iniciando()" (click)="iniciar()">Iniciar prova</ucam-button>
        </div>
      </div>
    </ucam-card>
  </div>
</app-moldura>
