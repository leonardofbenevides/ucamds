<app-moldura>
  <ucam-page-header variante="barra" title="Antes de começar" [breadcrumb]="trilha()" />

  <div class="ucam-corpo ucam-corpo--leitura ucam-stack ucam-stack--lg">
    <p class="ucam-lede">Leia com calma. A prova só começa quando você clicar em Iniciar prova.</p>

    <app-instrucoes-lista />

    @if (carregando()) {
      <ucam-skeleton variant="text" [lines]="3" />
    } @else {
      <ucam-description-list [items]="resumo()" layout="inline" [columns]="1" />
    }

    <ucam-alert tone="info">Ao clicar em Iniciar prova, o tempo de {{ tempoTexto() }} começa a contar e não para.</ucam-alert>

    @if (erro()) {
      <ucam-alert tone="danger" live="assertive">{{ erro() }}</ucam-alert>
    }

    <div class="ucam-cluster ucam-cluster--fim">
      <ucam-button variant="primary" size="lg" iconStart="doorOpen" [loading]="iniciando()" (click)="iniciar()">Iniciar prova</ucam-button>
    </div>
  </div>
</app-moldura>
