name: Publish Packages to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@leonardofbenevides'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build distribution and packages
        run: pnpm run build && pnpm run lib && pnpm run lib:sites && pnpm run elements && pnpm run pacotes && pnpm run publicar

      - name: Publish tarballs to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tgz in dist/pacotes/*.tgz; do
            echo "Publishing $tgz..."
            npm publish "$tgz" --registry=https://npm.pkg.github.com
          done
