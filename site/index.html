<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>DSUCAM — Design System da Universidade Candido Mendes</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Fundações, componentes, padrões e decisões do design system da UCAM. Gerado a partir dos contratos em spec/."
    />
    <!-- O símbolo do DSUCAM. Geometria idêntica à de
         src/app/shell/simbolo.component.ts e dos dois SVGs de assets/marca/ —
         um path só, com fill-rule='evenodd', porque um <mask> aqui exigiria um
         id e o favicon é o consumo mais frágil dos quatro.

         A tinta é wine.600 (#8D293A), a mesma do símbolo no cabeçalho. Estava
         em #6C1E2B (wine.700), que é o hover do primário: o favicon era a única
         peça do sistema num bordô que nenhuma outra usava. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%238D293A' fill-rule='evenodd' d='M8 2H16A6 6 0 0 1 22 8V16A6 6 0 0 1 16 22H8A6 6 0 0 1 2 16V8A6 6 0 0 1 8 2ZM14.1 11.5H16.9A2.6 2.6 0 0 1 19.5 14.1V16.9A2.6 2.6 0 0 1 16.9 19.5H14.1A2.6 2.6 0 0 1 11.5 16.9V14.1A2.6 2.6 0 0 1 14.1 11.5Z'/%3E%3C/svg%3E" />
    <!-- Aplica o tema antes da primeira pintura. Sem isto, uma página escura
         pisca em branco no carregamento. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ucam-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <ucam-root></ucam-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
